apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: electronix

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      nodeSelector:
         workload: application

      containers:
      - name: backend

        image: divaypratap/electronix-backend:v1

        ports:
        - containerPort: 5000

        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: electronix-config
              key: DB_HOST

        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: electronix-config
              key: DB_PORT

        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: electronix-config
              key: DB_NAME

        - name: CLIENT_URL
          valueFrom:
            configMapKeyRef:
              name: electronix-config
              key: CLIENT_URL

        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: electronix-config
              key: NODE_ENV

        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: electronix-secret
              key: DB_USER

        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: electronix-secret
              key: DB_PASSWORD

        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: electronix-secret
              key: SESSION_SECRET

        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000

          initialDelaySeconds: 10
          periodSeconds: 5

        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000

          initialDelaySeconds: 30
          periodSeconds: 10